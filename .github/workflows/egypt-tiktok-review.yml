name: Egypt Y-DNA external source watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/egypt-tiktok-review.yml'
      - 'tiktok_bot/source_watch.py'
      - 'tiktok_bot/test_source_watch.py'
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: egypt-ydna-external-source-watch
  cancel-in-progress: false

jobs:
  check-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safe parsing and difference logic
        run: python -m unittest tiktok_bot.test_source_watch -v
      - name: Monitor dated external YFull and FTDNA Egypt snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tiktok_bot.source_watch
