name: Egypt Y-DNA TikTok review

on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan for new published Egypt archive entries, or approve one review'
        required: true
        type: choice
        options:
          - scan
          - approve
        default: scan
      issue_number:
        description: 'GitHub review issue number (approve mode only)'
        required: false
        type: number

permissions:
  contents: write
  issues: write

concurrency:
  group: egypt-ydna-tiktok-review
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name == 'schedule' || inputs.mode != 'approve'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Generate candidate review issues and three-slide previews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m tiktok_bot.runner scan
      - name: Create separate FTDNA/YFull source-change research alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m tiktok_bot.alerts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egypt-ydna-tiktok-drafts
          path: tiktok_reviews/
          if-no-files-found: ignore
          retention-days: 30

  approve:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'approve' && github.actor == 'egyptydna'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Send human-approved content to Buffer for notification publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m tiktok_bot.runner approve --issue-number "${{ inputs.issue_number }}"
