name: Y-DNA checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r sync/requirements.txt
      - run: python -m unittest discover -s sync/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build:styles
      - run: git diff --exit-code -- styles/tailwind.generated.css
      - run: node sync/tests/frontend.test.cjs
      - run: node sync/tests/project-tracker.test.cjs
      - run: node sync/tests/profile-tools.test.cjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: disposable-ci-only
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f sync/tests/baseline.sql
      - run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: psql -v ON_ERROR_STOP=1 -f sync/tests/database-run.sql
      - run: psql -v ON_ERROR_STOP=1 -f sync/tests/database-identity-merges.sql
      - run: psql -v ON_ERROR_STOP=1 -f sync/tests/database-archive-evidence.sql
      - run: psql -v ON_ERROR_STOP=1 -f sync/tests/database-country-tracker.sql
      - run: psql -v ON_ERROR_STOP=1 -f sync/tests/database-uploaded-profiles.sql
      - run: psql -v ON_ERROR_STOP=1 -f sync/tests/database-project-tracking.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m sync.tests.build_owned_guard_scenarios
          psql -v ON_ERROR_STOP=1 -f /tmp/owned-archive-guard-scenarios.sql
