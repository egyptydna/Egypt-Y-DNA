name: Egypt Y-DNA Automatic Member Access Setup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview first; apply prepares automatic Verified without rules popup"
        type: choice
        required: true
        default: preview
        options: [preview, apply]

permissions:
  contents: read

concurrency:
  group: egypt-ydna-verification-setup
  cancel-in-progress: false

jobs:
  configure:
    name: Automatic Verified, private staff and public rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: python3 -m py_compile scripts/discord_rules_cleanup.py scripts/discord_verification_setup.py scripts/discord_member_verification.py scripts/discord_role_reactions.py
      - name: Test automatic verification safety
        run: python3 -m unittest discover -s tests -p test_discord_auto_verification.py -v
      - name: Consolidate official rules channel first
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MODE: ${{ inputs.mode }}
        run: python3 -u scripts/discord_rules_cleanup.py
      - name: Prepare auto Verified role without a mandatory popup
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MODE: ${{ inputs.mode }}
        run: python3 -u scripts/discord_verification_setup.py
