name: Egypt Y-DNA Rules Cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview first, then apply to consolidate duplicate rules channels"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: read

concurrency:
  group: egypt-ydna-discord-rules-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep official rules channel and archive duplicates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile scripts/discord_rules_cleanup.py scripts/discord_member_verification.py scripts/discord_verification_setup.py
      - name: Consolidate rules
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MODE: ${{ inputs.mode }}
        run: python3 -u scripts/discord_rules_cleanup.py
