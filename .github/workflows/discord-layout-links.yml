name: Egypt Y-DNA Discord Layout & Links

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview only or apply the changes"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply

permissions:
  contents: read

concurrency:
  group: egypt-ydna-discord-layout
  cancel-in-progress: false

jobs:
  update-discord:
    name: Community order, private staff, official links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/discord_layout_links.py
      - name: Update existing Discord server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MODE: ${{ inputs.mode }}
        run: python3 -u scripts/discord_layout_links.py
