name: Egypt Y-DNA Auto Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/discord_member_verification.py
      - tests/test_discord_auto_verification.py
      - .github/workflows/discord-member-verification.yml
  schedule:
    # Request checks every 5 minutes; GitHub may significantly delay cron jobs.
    - cron: "3-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: egypt-ydna-member-verification
  cancel-in-progress: false

jobs:
  verify-members:
    name: Automatically grant Verified to joined members
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check worker syntax
        run: python3 -m py_compile scripts/discord_member_verification.py scripts/discord_bot_roles.py
      - name: Test automatic verification and safe member filtering
        run: python3 -m unittest discover -s tests -p test_discord_auto_verification.py -v
      - name: Grant Verified without requiring a rules reaction
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 -u scripts/discord_member_verification.py
      - name: Automatically label bot accounts
        if: success()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 -u scripts/discord_bot_roles.py
