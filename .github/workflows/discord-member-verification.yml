name: Egypt Y-DNA Rules Emoji Verification

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, offset from the top of the hour to reduce congestion.
    - cron: "3-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: egypt-ydna-member-verification
  cancel-in-progress: false

jobs:
  verify-members:
    name: Verified only after ✅ reaction to official rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check worker syntax
        run: python3 -m py_compile scripts/discord_member_verification.py scripts/discord_bot_roles.py
      - name: Test rule reaction gate (never verify on join alone)
        run: python3 -m unittest discover -s tests -p test_discord_auto_verification.py -v
      - name: Assign Verified to members who clicked ✅ on #rules
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 -u scripts/discord_member_verification.py
      - name: Automatically label bot accounts
        if: success()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 -u scripts/discord_bot_roles.py
