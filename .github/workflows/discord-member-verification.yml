name: Egypt Y-DNA Auto Verification After Rules

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, offset from the top of the hour to reduce congestion.
    - cron: "3-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: egypt-ydna-member-verification
  cancel-in-progress: false

jobs:
  verify-members:
    name: Auto-grant Verified after Discord rules acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check worker syntax
        run: python3 -m py_compile scripts/discord_member_verification.py scripts/discord_bot_roles.py
      - name: Check Rules Screening and auto-grant Verified
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 -u scripts/discord_member_verification.py
      - name: Automatically label bot accounts
        if: success()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 -u scripts/discord_bot_roles.py
