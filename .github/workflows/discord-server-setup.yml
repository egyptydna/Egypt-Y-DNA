name: Egypt Y-DNA Discord Server Setup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = no changes; apply = create missing roles and channels"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply

permissions:
  contents: read

jobs:
  setup-discord:
    name: Configure existing Egypt Y-DNA Discord
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Discord server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MODE: ${{ inputs.mode }}
        run: python3 -u scripts/discord_server_redesign.py
