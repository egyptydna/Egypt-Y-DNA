name: Egypt Y-DNA Role Menu & New Results

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview first; apply publishes menus and opens new-results"
        type: choice
        required: true
        default: preview
        options: [preview, apply]

permissions:
  contents: read

concurrency:
  group: egypt-ydna-role-menu-rework
  cancel-in-progress: false

jobs:
  update-server:
    name: Flag role picker, detailed Y-DNA roles and open submissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate scripts
        run: python3 -m py_compile scripts/discord_role_menu.py scripts/discord_role_rework.py scripts/discord_role_reactions.py scripts/discord_staff_and_roles.py
      - name: Apply role picker redesign
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MODE: ${{ inputs.mode }}
        run: python3 -u scripts/discord_role_rework.py
