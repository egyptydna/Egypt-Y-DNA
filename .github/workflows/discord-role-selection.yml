name: Egypt Y-DNA Role Self-Selection

on:
  workflow_dispatch:
  # Recheck role picks as soon as the Verified workflow completes successfully.
  # This avoids requiring TWO independent, delayed GitHub cron runs.
  workflow_run:
    workflows: ["Egypt Y-DNA Rules Emoji Verification"]
    types: [completed]
  # Also process existing selections after fixing the worker.
  # This gives a one-time run on changes instead of waiting for an unreliable cron.
  push:
    branches: [main]
    paths:
      - scripts/discord_role_reactions.py
      - tests/test_discord_role_self_selection.py
      - .github/workflows/discord-role-selection.yml
  schedule:
    # Apply member-selected roles every 5 minutes; GitHub can delay scheduled jobs.
    - cron: "4-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: egypt-ydna-role-self-selection
  cancel-in-progress: false

jobs:
  assign-roles:
    name: Grant only nonprivileged self-selected origin and Y-DNA roles
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Python
        run: python3 -m py_compile scripts/discord_role_reactions.py
      - name: Test emoji assignment, conflicts and permissions
        run: python3 -m unittest discover -s tests -p test_discord_role_self_selection.py -v
      - name: Process role reactions
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 -u scripts/discord_role_reactions.py
